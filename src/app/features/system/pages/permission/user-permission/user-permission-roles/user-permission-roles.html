<div class="h-full flex flex-col w-full bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-800 shadow-sm p-4 space-y-4 transition-colors">
  <!-- Header -->
  <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-800 pb-3">
    <div class="text-xs font-semibold text-slate-600 dark:text-slate-300">
      Gán vai trò cho nhân viên: <span class="text-indigo-600 dark:text-indigo-400">{{ selectedUser?.USER_NAME }}</span>
    </div>
    <button type="button" (click)="onSave()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg shadow-sm transition-colors">Lưu vai trò</button>
  </div>

  <!-- Danh sách vai trò (Khung đã được thu nhỏ padding và tối ưu lưới) -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2 overflow-y-auto custom-scrollbar flex-1 pr-1 content-start">
    <div *ngFor="let role of roles" class="flex items-center justify-between p-2.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
      <div class="flex items-center gap-2 min-w-0">
        <input type="checkbox" [checked]="role.IS_ASSIGNED === 1" (change)="role.IS_ASSIGNED = role.IS_ASSIGNED === 1 ? 0 : 1" class="w-3.5 h-3.5 accent-indigo-600 rounded cursor-pointer flex-shrink-0">
        <div class="min-w-0">
          <p class="font-bold text-[11px] text-slate-800 dark:text-slate-200 truncate">🛡️ {{ role.ROLE_NAME }}</p>
          <p class="text-[10px] text-slate-500 dark:text-slate-400 truncate">{{ role.ROLE_DESC || 'Không có mô tả' }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
