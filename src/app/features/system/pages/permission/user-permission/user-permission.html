<div class="flex flex-col h-full w-full bg-slate-50 dark:bg-slate-950 overflow-hidden">
  
  <!-- 3 TAB CHUYỂN ĐỔI CHI TIẾT CỦA NHÂN VIÊN (Giữ nguyên cố định) -->
  <div class="flex items-center px-4 pt-3 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 gap-2 flex-shrink-0">
    <button type="button" (click)="activeDetailTab = 'info'"
      [ngClass]="activeDetailTab === 'info' ? 'border-indigo-600 text-indigo-600 dark:text-indigo-400 bg-indigo-50/50 dark:bg-indigo-950/30' : 'border-transparent text-slate-500 hover:text-slate-700'"
      class="px-4 py-2 text-xs font-semibold border-b-2 rounded-t-lg transition-all flex items-center gap-1.5">
      <span>😊</span> Thông tin tài khoản
    </button>

    <button type="button" (click)="activeDetailTab = 'safe'"
      [ngClass]="activeDetailTab === 'safe' ? 'border-indigo-600 text-indigo-600 dark:text-indigo-400 bg-indigo-50/50 dark:bg-indigo-950/30' : 'border-transparent text-slate-500 hover:text-slate-700'"
      class="px-4 py-2 text-xs font-semibold border-b-2 rounded-t-lg transition-all flex items-center gap-1.5">
      <span>🛡️</span> Phân quyền giới hạn (Safe)
    </button>

    <button type="button" (click)="activeDetailTab = 'roles'"
      [ngClass]="activeDetailTab === 'roles' ? 'border-indigo-600 text-indigo-600 dark:text-indigo-400 bg-indigo-50/50 dark:bg-indigo-950/30' : 'border-transparent text-slate-500 hover:text-slate-700'"
      class="px-4 py-2 text-xs font-semibold border-b-2 rounded-t-lg transition-all flex items-center gap-1.5">
      <span>🏷️</span> Thuộc tính vai trò
    </button>
  </div>

  <!-- NỘI DUNG TỪNG TAB: ĐÃ SỬA LẠI ĐỂ KHÓA KHUNG VÀ CHO PHÉP TAB CON TỰ SCROLL -->
  <div class="flex-1 min-h-0 flex flex-col overflow-hidden">
    
    <!-- Trường hợp chưa chọn nhân viên nào -->
    <div *ngIf="!selectedUser" class="text-center py-20 text-xs text-slate-400 space-y-1">
      <p class="text-base">👈</p>
      <p>Vui lòng chọn một nhân viên ở danh sách bên trái để xem chi tiết.</p>
    </div>

    <!-- Khung bọc các tab con, thêm h-full flex flex-col min-h-0 -->
    <div *ngIf="selectedUser" class="h-full flex flex-col min-h-0">
      
      <!-- TAB 1: Thông tin -->
      <app-user-permission-info 
        *ngIf="activeDetailTab === 'info'"
        class="h-full flex flex-col min-h-0 overflow-y-auto custom-scrollbar"
        [selectedUser]="selectedUser"
        [isNewUser]="isNewUser"
        [isEditing]="isEditing"
        [avatarBaseUrl]="avatarBaseUrl"
        [allUsers]="allUsers"
        (startCreate)="startCreate()"
        (startEdit)="startEdit()"
        (cancelAction)="cancelAction()"
        (saveUserChanges)="saveUserChanges()"
        (avatarSelected)="onAvatarSelected($event)">
      </app-user-permission-info>

      <!-- TAB 2: Safe (Đã dọn dẹp lại thẻ div bọc thừa, đưa class chuẩn vào component) -->
      <app-user-permission-safe 
        *ngIf="activeDetailTab === 'safe'"
        class="h-full flex flex-col min-h-0 overflow-hidden"
        [selectedUser]="selectedUser"
        [menuTree]="menuTree"
        (expandAll)="expandAll()"
        (collapseAll)="collapseAll()"
        (saveSafePermissions)="saveSafePermissions()"
        (toggleAllRow)="toggleAllRow($event)"
        (toggleNode)="toggleNode($event)">
      </app-user-permission-safe>

      <!-- TAB 3: Roles -->
      <app-user-permission-roles 
        *ngIf="activeDetailTab === 'roles'"
        class="h-full flex flex-col min-h-0 overflow-y-auto custom-scrollbar"
        [selectedUser]="selectedUser"
        [roles]="roles"
        (saveRoles)="saveUserRoles($event)">
      </app-user-permission-roles>
    </div>
  </div>
</div>
